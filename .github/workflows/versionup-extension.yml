name: Version Up (Chrome extension)

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/**"
  # Lets a release be retried without a dummy commit -- e.g. after fixing
  # GH_PAT. Re-running a failed run is not equivalent: it replays the workflow
  # file from the original commit, so fixes to this file are not picked up.
  workflow_dispatch:

jobs:
  # The `paths:` filter above can only ask "did any file under
  # chrome-extension/ change", and for every shared translation edit the answer
  # is yes: scripts/sync_locales.py rewrites both modules' committed copies of
  # locales/, so a string only the desktop app displays still rewrites the
  # extension's copy. That released the extension twice for keys it never reads
  # (v1.3.6, v1.3.7). locale_impact.py asks the narrower question -- did this
  # diff touch anything the extension's own source references -- and only that
  # answer gates the release below.
  #
  # A separate job so the answer is known before `versionup` claims the shared
  # concurrency slot; a skipped job never claims it.
  impact:
    # `[skip versionup]` holds off both modules (the bump merges use it) and
    # `[skip versionup:extension]` holds off this one, as a manual override of
    # the check below -- e.g. to sit on a wording fix the extension does use.
    # NOTE: this reads the *head commit of the push*, which for the usual PR
    # flow is the merge commit, not any commit on the branch. Put the marker in
    # the merge subject (`gh pr merge --subject`), or it is never seen. The two
    # tokens do not overlap, since '[skip versionup]' requires the ']'
    # immediately after the word.
    if: >-
      !contains(github.event.head_commit.message, '[skip versionup]') &&
      !contains(github.event.head_commit.message, '[skip versionup:extension]')
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.impact.outputs.affected }}
    steps:
      # Full history: the script diffs against github.event.before, which a
      # shallow clone would not contain.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # `before` is empty on workflow_dispatch and unreachable after a force
      # push; the script reports every module affected in that case, so a
      # manual retry still releases.
      - name: Does this push reach the extension?
        id: impact
        run: |
          python scripts/locale_impact.py \
            --module chrome-extension \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --github-output

  versionup:
    needs: impact
    if: needs.impact.outputs.affected == 'true'
    # Shared with versionup-desktop.yml — see the note there for why this is
    # job-level rather than workflow-level.
    concurrency:
      group: versionup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # One checkout, not a sparse one for the preflight script followed by a
      # full one: a second checkout into the same workspace reuses the existing
      # clone, so `core.sparseCheckout` survives and the rest of the tree never
      # appears.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # Preflight before any real work, because a bad GH_PAT otherwise surfaces
      # only at the very last step, as an unreadable JSON parse error. Checkout
      # passing above says nothing about the token: this repo is public, so an
      # empty or invalid one still clones anonymously.
      - name: Verify GH_PAT
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Not used to do anything -- it is the control in the probe: a second,
          # unrelated credential that tells a bad PAT apart from a broken
          # authenticated path.
          ACTIONS_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-pat.sh "${{ github.repository }}" release-extension.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Compute and apply version
        id: versionup
        run: python chrome-extension/scripts/versionup.py

      - name: Check for file changes
        id: changes
        run: |
          if git diff --quiet chrome-extension/version chrome-extension/src/manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit on release branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/extension-v${{ steps.versionup.outputs.version }}"
          git checkout -b "$BRANCH"
          git add chrome-extension/version chrome-extension/src/manifest.json
          git commit -m "chore(chrome-extension): bump version to ${{ steps.versionup.outputs.version }} [skip versionup]"
          git push origin "$BRANCH"

      - name: Create PR and merge to main
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="release/extension-v${{ steps.versionup.outputs.version }}"
          VERSION="${{ steps.versionup.outputs.version }}"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(chrome-extension): bump version to $VERSION" \
            --body "Automated version bump of the Chrome extension to $VERSION"
          gh pr merge "$BRANCH" --merge --delete-branch \
            --subject "chore(chrome-extension): bump version to $VERSION [skip versionup]"

      # Deliberately not gated on `changed`: when chrome-extension/version was
      # bumped by hand (a minor/major release), versionup.py finds it untagged
      # and keeps it, so there is nothing to commit — but the tag still has to
      # be pushed, or the release never happens. The existence check below makes
      # this safe to re-run.
      - name: Push tag
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="extension-v${{ steps.versionup.outputs.version }}"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::secrets.GH_PAT is empty or unset. A PAT is required here, not GITHUB_TOKEN: tags pushed with GITHUB_TOKEN do not trigger release-extension.yml."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            if ! SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha'); then
              echo "::error::Could not read main's SHA, despite the GH_PAT preflight passing. Re-run with the raw response:"
              gh api "repos/${{ github.repository }}/git/ref/heads/main" --include || true
              exit 1
            fi
            gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$SHA"
            echo "Created tag $TAG at $SHA"
          fi
